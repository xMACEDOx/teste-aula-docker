services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    user: root
    ports:
      - "9000:9000" #programa usado pela api
      - "9003:9003" #usado no navegador
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9003" /data
    networks:
      rede_fia:

networks:
  rede_fia:
    driver: bridge

volumes:
 minio_storage: {}
